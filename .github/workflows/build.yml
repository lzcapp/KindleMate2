name: build

on:
  push:
    branches: [main, 'dev-*']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      # 自 2026-09-13 起仓库不再有子模块(WinForms 壳与 DarkModeForms 子模块已退休)
      - name: Checkout
        uses: actions/checkout@v7

      # 必须 10.x,不能用 8.0.x —— 两条独立理由:
      #   ① Avalonia 12 的源生成器要求 Roslyn >= 4.14(SDK 8 是 4.8、SDK 9 是 4.12)。低版时
      #      Roslyn 不报错、只发一条 CS9057 警告就静默跳过生成器,于是 InitializeComponent 与所有
      #      x:Name 字段都没被声明,满屏 CS0103(2026-09-13 的 release 六变体即因此全挂)。
      #   ② 原本这句写 8.0.x 也是无效的:setup-dotnet 把 SDK 装进镜像默认目录,没有 global.json 时
      #      dotnet 仍按「已装最高版」解析(即镜像预装的 10.x),声明与实际跑的版本并不一致。
      # 注:这是**构建用 SDK**,产物目标框架仍是 net8.0,不抬高用户端的 .NET 运行时要求。
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KindleMate2.sln

      # Clean full build (no incremental cache): mirrors the project rule that
      # incremental "0 errors" is not proof of a healthy build (CS0542 and a
      # missing interface file were previously masked by obj/ caches for months).
      - name: Build Debug (full, no incremental)
        run: dotnet build KindleMate2.sln -c Debug --no-restore --no-incremental

      - name: Build Release (full, no incremental)
        run: dotnet build KindleMate2.sln -c Release --no-restore --no-incremental

      - name: Run tests
        run: dotnet test KindleMate2.sln -c Debug --no-build --no-restore

  # 跨平台验证。2026-09-13 WinForms 壳与 DarkModeForms 子模块退休后,
  # 解决方案只剩跨平台项目(Shared/Domain/Infrastructure/Application/Devices.Windows/Tests/Avalonia),
  # 因此这里能构建**整个解决方案**并跨平台跑单测,而不只是壳的 net8.0 子集。
  #
  # 说明:Devices.Windows 与 Avalonia 的 net8.0-windows TFM 在 Linux/macOS 上可以还原与编译
  # (Windows 引用包可由 NuGet 还原),只是不能运行;net8.0 变体才是运行时目标。
  cross-platform-build:
    name: cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SDK 版本同 build-and-test:必须 10.x(Avalonia 源生成器要求 Roslyn >= 4.14)。
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore KindleMate2.sln

      - name: Build solution (full, no incremental)
        run: dotnet build KindleMate2.sln -c Release --no-restore --no-incremental

      - name: Run tests (cross-platform TFM)
        run: dotnet test KindleMate2.Tests/KindleMate2.Tests.csproj -c Release --no-build --no-restore

      # 实跑一次自检:验证应用能启动、SQLite 原生库可用、系统文案资源可解析,
      # 且平台设备实现按预期降级为 NullDeviceManager。
      - name: Boot self-check
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          touch "$work/empty.dat"
          dotnet KindleMate2.Avalonia/bin/Release/net8.0/KindleMate2.Avalonia.dll \
            --smoke "$work/empty.dat" "$work/smoke.txt"
          cat "$work/smoke.txt"
          grep -q "NullDeviceManager" "$work/smoke.txt"
          echo "cross-platform boot check passed on ${{ matrix.os }}"
