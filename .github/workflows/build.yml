name: build

on:
  push:
    branches: [main, 'dev-*']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      # 自 2026-09-13 起仓库不再有子模块(WinForms 壳与 DarkModeForms 子模块已退休)
      # 全历史:应用版本号由 git tag 派生,浅克隆取不到 tag → 需要完整历史。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 必须 10.x,不能用 8.0.x —— 两条独立理由:
      #   ① Avalonia 12 的源生成器要求 Roslyn >= 4.14(SDK 8 是 4.8、SDK 9 是 4.12)。低版时
      #      Roslyn 不报错、只发一条 CS9057 警告就静默跳过生成器,于是 InitializeComponent 与所有
      #      x:Name 字段都没被声明,满屏 CS0103(2026-09-13 的 release 六变体即因此全挂)。
      #   ② 原本这句写 8.0.x 也是无效的:setup-dotnet 把 SDK 装进镜像默认目录,没有 global.json 时
      #      dotnet 仍按「已装最高版」解析(即镜像预装的 10.x),声明与实际跑的版本并不一致。
      # 注:2026-09-14 起产物目标框架已一并升到 net10.0。此前是「构建用 SDK 10 + 产物 TFM 8」的
      #     错位组合(当初刻意只抬 SDK,以维持用户端 .NET 8 运行时要求),现两者版本一致;
      #     框架依赖变体的用户端要求随之变为 .NET 10 Desktop Runtime,
      #     而 .NET 8 运行时本身在 2026-11-10 停更,故该变化是收拢而非新增负担。
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KindleMate2.sln

      # Clean full build (no incremental cache): mirrors the project rule that
      # incremental "0 errors" is not proof of a healthy build (CS0542 and a
      # missing interface file were previously masked by obj/ caches for months).
      - name: Build Debug (full, no incremental)
        run: dotnet build KindleMate2.sln -c Debug --no-restore --no-incremental

      - name: Build Release (full, no incremental)
        run: dotnet build KindleMate2.sln -c Release --no-restore --no-incremental

      - name: Run tests
        run: dotnet test KindleMate2.sln -c Debug --no-build --no-restore --filter "Category!=Manual"

      # 发布冒烟(-r + --self-contained):补一个长期盲区 —— 上面几步只走普通 build/test,
      # 从不碰发布专属的 RID 路径,于是 2026-09-06 那类"只有发版才炸"的故障(SDK 10 发布
      # net8 目标 + -r + 旧 assets 触发 NuGet restore 崩溃 MSB4181/path1 null)只能等打 tag
      # 那天在 Release 里暴露。这里只跑 win-x64 自包含一档 —— 矩阵里风险最高的组合,
      # 足以覆盖该路径,又不必为六变体矩阵付 CI 成本。
      - name: Publish smoke (win-x64, self-contained)
        run: dotnet publish KindleMate2.Avalonia/KindleMate2.Avalonia.csproj -f net10.0-windows -c Release -r win-x64 --self-contained true -o publish/smoke

      # 实跑发布产物:验证 apphost、SQLite 原生库、卫星资源与平台设备实现都随发布产物一起
      # 落地 —— 也就是 release 真正交付的那个形态(上面各步验的是 obj/bin 里的中间产物)。
      # Windows 上设备实现应为 Devices.Windows.DeviceManager(macOS/Linux 各有自己的实现,只有
      # 三者之外的平台才落到 NullDeviceManager)。
      # shell 必须用 bash:pwsh 调用 GUI 子系统(WinExe)不会等待进程退出,断言会读到空文件。
      - name: Boot self-check (published)
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          touch "$work/empty.dat"
          # 原生 exe 只认 Windows 路径,而 mktemp 给的是 MSYS 形式(/tmp/...),故转一下;
          # 且 --smoke 内部会切换当前目录,所以传参一律用绝对路径。
          db="$(cygpath -w "$work/empty.dat")"
          out="$(cygpath -w "$work/smoke.txt")"
          ./publish/smoke/KindleMate2.exe --smoke "$db" "$out"
          cat "$out"
          grep -q "Devices.Windows.DeviceManager" "$out"
          # 清洗预览的视图层拼装在 Avalonia 工程里,单测够不着 ⇒ 在这里钉。
          # 只断言结构,不断言文案(CI 是 en 环境,拿中文串比必然假红)。
          grep -q "clean preview:.*result=OK" "$out"
          # 表格列冗余判定(整列同值时收起)—— 同样是单测够不着的 VM 行为
          grep -q "table columns:.*result=OK" "$out"
          # 回收站视图能进能出(IsRecycleBinView 必须复位)
          grep -q "recycle bin view:.*result=OK" "$out"
          # 列表项元信息行:书名必须不在 MetaTail 里(它单独占一列、负责省略)
          grep -q "list meta row:.*result=OK" "$out"
          grep -q "word sections:.*result=OK" "$out"
          grep -q "nav menu:.*result=OK" "$out"
          # 源码断言:两段的小标题必须还画在列表模板里。
          # 编译期绑定只保证 SectionTitle/IsSectionHeader 存在,不保证模板里还留着这一行 ——
          # 删掉它不报错,两段就悄悄退化成一条看不出分界的平表。
          grep -q 'IsVisible="{Binding IsSectionHeader}"' KindleMate2.Avalonia/Views/MainWindow.axaml
          # 源码断言:标题行必须**点不动**(把它的 ListBoxItem 置为不可用)。
          # 同上的理由,再叠一层:这条样式是纯视图层的,单测工程又不引 Avalonia,够不着 ——
          # 删掉它不报错、测试也不红,标题行就又变成可点、可高亮、一点就把右栏清空。
          # 注意绑定挂在 Setter 的 Value 上(不是 IsEnabled 上),模式必须照着真实写法写。
          grep -Eq '<Setter +Property="IsEnabled" +Value="\{Binding +!IsSectionHeader\}"' KindleMate2.Avalonia/Views/MainWindow.axaml
          grep -q "share card:.*result=OK" "$out"
          # 源码断言:分享入口的接线（编译期绑定不保证菜单项还在，见 MainWindow.axaml）
          grep -q 'Click="OnShareSelectedClipping"' KindleMate2.Avalonia/Views/MainWindow.axaml
          grep -q 'IsVisible="{Binding CanShareSelectedClipping}"' KindleMate2.Avalonia/Views/MainWindow.axaml
          grep -q "context menu:.*result=OK" "$out"
          # 删除一行后列表不跳回顶部 —— 探针只钉得住"挑行判据"这条纯逻辑
          grep -q "row restore:.*result=OK" "$out"
          # 「库内有任意数据」门禁:纯生词库不该被当成空库(备份/统计/清空因此不该被挡)
          grep -q "data gate:.*result=OK" "$out"
          # 源码断言:上面那条判据要真被用上,靠的是两处接线,而这两处都是
          # "删掉不报错、单测也不红"的胶水(单测工程不引 Avalonia,够不着 VM)。
          # ① 行级删除把"原来那一行的位置"传下去(不传 ⇒ 功能静默失效);
          grep -q 'restoreRowIndex: rowIndex' KindleMate2.Avalonia/ViewModels/MainWindowViewModel.cs
          # ② 两处列表重建(标注 / 生词)都要走挑行函数(退回无脑 FirstOrDefault 同样静默失效)。
          #    数量写死 2:将来若真多出第三处重建,这里该红一次,人工确认后再改这个数。
          test "$(grep -c 'PickRowAfterRebuild() ??' KindleMate2.Avalonia/ViewModels/MainWindowViewModel.cs)" -eq 2
          # 关于页「运行环境」必须带 RID（旧写法在 macOS/Linux 上都显示 Unix，分不出平台）
          grep -q "about runtime:.*result=OK" "$out"
          echo "windows 发布产物自检通过(win-x64 self-contained)"

  # 跨平台验证。2026-09-13 WinForms 壳与 DarkModeForms 子模块退休后,
  # 解决方案只剩跨平台项目(Shared/Domain/Infrastructure/Application/Devices.Windows/Tests/Avalonia),
  # 因此这里能构建**整个解决方案**并跨平台跑单测,而不只是壳的 net10.0 子集。
  #
  # 说明:Devices.Windows 与 Avalonia 的 net10.0-windows TFM 在 Linux/macOS 上可以还原与编译
  # (Windows 引用包可由 NuGet 还原),只是不能运行;net10.0 变体才是运行时目标。
  cross-platform-build:
    name: cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 全历史:应用版本号由 git tag 派生,浅克隆取不到 tag。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # SDK 版本同 build-and-test:必须 10.x(Avalonia 源生成器要求 Roslyn >= 4.14)。
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore KindleMate2.sln

      - name: Build solution (full, no incremental)
        run: dotnet build KindleMate2.sln -c Release --no-restore --no-incremental

      - name: Run tests (cross-platform TFM)
        run: dotnet test KindleMate2.Tests/KindleMate2.Tests.csproj -c Release --no-build --no-restore --filter "Category!=Manual"

      # 实跑一次自检:验证应用能启动、SQLite 原生库可用、系统文案资源可解析,
      # 且平台设备实现按预期选中(Windows 之外为 Devices.MacOS / Devices.Linux)。
      - name: Boot self-check
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          touch "$work/empty.dat"
          dotnet KindleMate2.Avalonia/bin/Release/net10.0/KindleMate2.dll \
            --smoke "$work/empty.dat" "$work/smoke.txt"
          cat "$work/smoke.txt"
          # 断言当前平台选到了预期实现:macOS 走 Devices.MacOS(/Volumes),Linux 走 Devices.Linux
          # (/media 等候选挂载根)。两者共用 Devices.Posix 里的实现,只是薄壳不同。
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            expect="Devices.MacOS.DeviceManager"
          else
            expect="Devices.Linux.DeviceManager"
          fi
          grep -q "$expect" "$work/smoke.txt"
          # 「同步到 Kindle 设备」菜单项:设备未连接时必须置灰,并说清原因。
          # 三条行为断言都取**确定性**状态 —— 自检里前两条来自"库还没开"(探测必然未连接),
          # 后两条由自检直接给绑定源赋两种值;都不看真实探测,因为 runner 上必然没设备,
          # 而开发机上可能真插着 Kindle,照真实探测断言就随现场硬件变色。
          #   no session : 置灰 + 提示「先打开数据库」(优先于「先连接设备」)
          #   offline    : 置灰 + 提示「先连接设备」
          #   online     : 可点 + 提示不再停在「先连接设备」
          grep -q "sync menu(no session): enabled=False hintOpensDb=True" "$work/smoke.txt"
          grep -q "sync menu(offline): enabled=False hintNeedsDevice=True" "$work/smoke.txt"
          grep -q "sync menu(online): enabled=True hintNeedsDevice=False" "$work/smoke.txt"
          # 上面三条钉的是**绑定源**;编译期绑定只保证路径能解析,不保证菜单项还挂着这个属性
          # (菜单重构时删掉 IsEnabled= 不会编译报错,菜单却再也不置灰了)。所以在源码上钉一句。
          grep -Eq 'IsEnabled="\{Binding +IsDeviceConnected\}"' KindleMate2.Avalonia/Views/MainWindow.axaml
          # 状态栏右侧的「● 设备未连接」必须自己声明垂直居中,不能吃默认值。
          # 同一个 StackPanel 里的更新按钮基线样式带 MinHeight=28(App.axaml),有更新时它把整排
          # 撑到 28px;而 TextBlock 的 VerticalAlignment 默认是 Stretch ⇒ 被拉伸后文字画在自己
          # 的**顶部**,比左侧居中的「有新版本 …」高出约 7px(2026-09-22 用户报的错位)。
          # 没有更新按钮时整排只有一行文字高,拉伸等于自身高度 ⇒ 只有"有更新时"才现形,
          # 平时看不出来。编译期绑定管不到这个属性(删掉不报错、只是错位),所以在源码上钉一句。
          grep -Eq 'Text="\{Binding DeviceStatus\}" +VerticalAlignment="Center"' KindleMate2.Avalonia/Views/MainWindow.axaml
          # 时间戳格式串**只许**在 AppConstants 里定义一次。
          # 它此前散在五个地方(两个常量 + 三处硬编码:库备份/维护清单/导入文件/清空前保底/统计截图),
          # 而那条 InvariantCulture 修复当年就是**分头改的** —— 所以这里把两件事都钉住:
          # ① 不许再硬编码这个格式串;② 每个用点都必须配 InvariantCulture
          #    (非公历日历会把年份变成 2569/1405/1448,文件名就读不出日期、也排不了序)。
          # 用 git grep 而不是 grep -r:只搜**被跟踪的**源码 —— grep -r 会扫进 bin/obj
          # (CI 到这一步已经构建过),既慢又可能命中生成物;而 BSD grep(macOS)不支持 --exclude-dir。
          if git grep -n 'ToString("yyyyMMdd_HHmmss"' -- '*.cs'; then
            echo "时间戳格式串又被硬编码了 —— 请改用 AppConstants.FileTimestampFormat"; exit 1
          fi
          if git grep -n 'ToString(AppConstants.FileTimestampFormat' -- '*.cs' | grep -v InvariantCulture; then
            echo "时间戳用点漏了 InvariantCulture —— 非公历日历下年份会变成 2569/1405/1448"; exit 1
          fi
          # 测试里不许再出现**进程级清池**。SqliteConnection.ClearAllPools() 会关掉所有空闲池化连接，
          # 而 xUnit 默认类间并行 ⇒ 一个测试类 Dispose 时会把别的类正在复用的连接一起销毁
          # (实测 ~1/6 概率报 ObjectDisposedException: 'SQLitePCL.sqlite3')。
          # 清池集中在 TestTempCleanup 的进程退出时做一次（那时已无测试在跑）。
          if git grep -n 'ClearAllPools' -- 'KindleMate2.Tests/*.cs' | grep -v 'TestTempCleanup.cs'; then
            echo "测试里又出现了进程级清池 —— 请改用 TestTempCleanup 的退出时清扫"; exit 1
          fi
          # 清洗预览的视图层拼装(噪音单独暴露 + 尾部不被截断)—— 同 Windows 作业的理由
          grep -q "clean preview:.*result=OK" "$work/smoke.txt"
          # 表格列冗余判定 —— 同 Windows 作业的理由
          grep -q "table columns:.*result=OK" "$work/smoke.txt"
          # 回收站视图能进能出
          grep -q "recycle bin view:.*result=OK" "$work/smoke.txt"
          grep -q "list meta row:.*result=OK" "$work/smoke.txt"
          grep -q "word sections:.*result=OK" "$work/smoke.txt"
          # 「库内有任意数据」门禁:纯生词库不该被当成空库(备份/统计/清空因此不该被挡)
          grep -q "data gate:.*result=OK" "$work/smoke.txt"
          # 生词域右栏详情里的生词高亮:与中栏那一行同源,正负例都验(正例读 Run 的粗体,
          # 负例拿书名当词 —— 少了域判据就会满屏加粗)。同样够不着单测:Avalonia 工程里的 VM。
          grep -q "detail emphasis:.*result=OK" "$work/smoke.txt"
          grep -q "nav menu:.*result=OK" "$work/smoke.txt"
          # 「重命名生词」两处菜单的可用性。VM 那层单测够不着(单测工程不引 Avalonia),
          # 而拼键/撞名那两条纯规则在 WordRenameRulesTests 里 —— 两层各钉各的。
          grep -q "word rename:.*result=OK" "$work/smoke.txt"
          # 自检必须把联网查释义关掉:CI 不该依赖第三方词典(慢、易 flaky),也不该把词条发出去
          grep -q "online definition: enabled=False" "$work/smoke.txt"
          # 源码断言:左栏那两项的显隐必须还绑着(编译期绑定只保证属性存在,
          # 不保证菜单项上还留着 IsVisible —— 删掉它不报错,菜单又会全域都出现)。
          grep -Eq 'IsVisible="\{Binding +CanRenameCurrentBook\}"' KindleMate2.Avalonia/Views/MainWindow.axaml
          grep -Eq 'IsVisible="\{Binding +CanExportCurrent\}"' KindleMate2.Avalonia/Views/MainWindow.axaml
          # 「重命名生词」共三处入口(左栏词节点 / 中栏列表行 / 详情面板),对齐「重命名书籍」。
          # 左栏这条与上面的 CanRenameCurrentBook **互斥**:丢了 IsVisible 的话,
          # 生词域的右键里会同时冒出「重命名书籍」和「重命名生词」两条。
          # Click 与 IsVisible 都要钉:入口从菜单里消失不报错,探针也不红。
          grep -Eq 'IsVisible="\{Binding +CanRenameCurrentWord\}"' KindleMate2.Avalonia/Views/MainWindow.axaml
          grep -q 'Click="OnRenameCurrentWord"' KindleMate2.Avalonia/Views/MainWindow.axaml
          # 另两处共用同一条判定,必须**两处都在** —— 只钉"存在"的话少掉一处不会被发现。
          # 数量写死 2:将来若真多出第三处,这里该红一次,人工确认后再改这个数。
          test "$(grep -c 'Click="OnRenameSelectedWord"' KindleMate2.Avalonia/Views/MainWindow.axaml)" -eq 2
          test "$(grep -c 'IsVisible="{Binding CanRenameSelectedWord}"' KindleMate2.Avalonia/Views/MainWindow.axaml)" -eq 2
          # 生词详情的「在线释义」块:**条件可见** —— 只有联网查到释义才出现,没联网/没这个词就整块收起。
          # 编译期绑定不保证这一行还在(删掉 IsVisible 不报错,释义块会在没有释义时也占一块空白),
          # 所以与状态栏那条同理,在源码上钉一句。
          grep -Eq 'IsVisible="\{Binding +Detail.HasDefinition\}"' KindleMate2.Avalonia/Views/MainWindow.axaml
          # 启动自动查更新的接线:编译期绑定管不到"方法有没有被调用",删掉那一行不报错,
          # 只是用户再也收不到自动提示 —— 而他并不知道自己"应该"收到。故在源码上钉一句。
          # 断言专门找 CheckForUpdatesQuietlyAsync 这个**独立名字**:若图省事复用菜单的
          # CheckForUpdatesAsync,菜单那处调用会让这条断言恒真(项目踩过"空断言")。
          grep -q 'CheckForUpdatesQuietlyAsync();' KindleMate2.Avalonia/Views/MainWindow.axaml.cs
          grep -q "share card:.*result=OK" "$work/smoke.txt"
          grep -q "context menu:.*result=OK" "$work/smoke.txt"
          grep -q "about runtime:.*result=OK" "$work/smoke.txt"
          # 表格模式:选中哪一行,动作就必须作用在那一行。
          # 这条探针**端到端**(建临时库 → 切表格模式 → 选中某行 → 真删 → 回查库里少了谁),
          # 不是只比属性 —— "同步写对了、但删除仍读旧源"那种半吊子修法会被它抓住。
          # 放在本作业是因为它需要**会话** —— 那段自检跑在启动建库之后,而 Windows 作业拿不到会话。
          grep -q "table selection:.*result=OK" "$work/smoke.txt"
          # 重命名生词撞名时**静默并入**(不再弹「已存在同名生词」把操作拦下)——
          # 同样是端到端:真库、真改名、真回查 lookups 有没有搬对、重号行有没有丢掉。
          grep -q "word merge:.*result=OK" "$work/smoke.txt"
          echo "cross-platform boot check passed on ${{ matrix.os }} (device: $expect)"

      # 防回归:scripts/bundle-libmtp.sh 曾经只接受绝对路径,而 release.yml 传进去的是
      # 相对路径 —— 脚本中途 `cd` 进构建目录后,相对路径会被**相对新 cwd 再解析一次**,
      # 于是 `cd "$BUILD_DIR/$LIBUSB_SRC"` 变成 build/libmtp/build/libmtp/libusb-…,
      # 必然 "No such file or directory"。这个缺陷在本机人工演练时看不出来(手打命令
      # 惯用绝对路径),只在发版作业上才现形 —— 所以需要在这里提前拦住。
      # 成本近零:自检不解包、不下载、不编译,只断言路径已在 cd 之前锚定为绝对路径。
      - name: Bundle script path check
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          # 仅为满足脚本的 .app 形态检查;自检模式不会往里写任何东西。
          mkdir -p build/KindleMate2.app/Contents
          BUNDLE_LIBMTP_CHECK_PATHS=1 \
            bash scripts/bundle-libmtp.sh build/KindleMate2.app --arch universal --build-dir build/libmtp
