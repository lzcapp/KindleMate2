name: release

# 发布即自动化:push 日期式 tag(如 2026.09.13)或手动 dispatch 触发。
#
# 共 12 个资产(不带版本号):
#   Windows(6 个 zip):KindleMate2_{arm64,x64,x86}[_runtime].zip
#   Linux(4 个 tar.gz):KindleMate2_{linux-x64,linux-arm64}[_runtime].tar.gz
#   macOS(2 个 dmg):KindleMate2_{macos-arm64,macos-x64}.dmg —— 内含 KindleMate2.app
# 命名规则(2026-09-06 用户确认):**_runtime = 自包含(打包 .NET Runtime,免装)**;
#   无该后缀 = framework-dependent(需目标机自行安装 .NET 10 运行时)。
#   macOS 只出自包含的 dmg(要求 mac 用户先装 .NET 运行时体验不值当),故不带该后缀。
#   → 合并进 GitHub Release(免手动登录 gh)。
#
# 2026-09-13 变更 A:WinForms 壳与 DarkModeForms 子模块退休,发布目标改为 Avalonia 壳
#   (KindleMate2.Avalonia)。本流程不再需要 checkout 子模块;需显式指定目标框架 ——
#   Windows 用 -f net10.0-windows,非 Windows 用 -f net10.0(该工程多目标 net10.0-windows;net10.0)。
#   同时移除 PublishSingleFile(单文件打包未实机验证,先用普通目录式 publish)。
#
# 2026-09-13 变更 B:Linux 产物。**必须在 Unix runner 上发布并打包** —— zip/tar 从 NTFS
#   生成时记录不出可执行位,解压出来是 644、直接运行会 permission denied。故用 tar.gz
#   且打包前 chmod +x。
#   包内另带一个 `kindlemate2` 启动器:程序按「当前工作目录」定位数据库(与原版一致,刻意不改
#   代码),而从文件管理器双击或从别处调用时工作目录并不在解压目录 —— 启动器先切到数据目录再
#   exec 真程序。数据目录遵守 XDG:优先 $KINDLEMATE2_HOME,否则 ${XDG_DATA_HOME:-~/.local/share}/KindleMate2。
#   自检也走启动器,因此「先切目录」这段逻辑同样在发版前被验证。
#   ⚠️ 从旧版 tar.gz 升级的用户,库还留在原解压目录 → 发布说明里给了迁移命令。
#
# 2026-09-13 变更 C:macOS 产物改为 .app + .dmg,并在 **macOS runner** 上构建。
#   原因:① Apple Silicon 要求可执行文件带有效签名,在 macOS 上发布才会走原生签名路径;
#   ② 做图标(sips/iconutil)、bundle 签名(codesign)、磁盘映像(hdiutil)都需要 macOS 工具;
#   ③ 本仓库是公开的,GitHub 托管的 macOS runner 不计费。
#   两个已解决的坑:
#     - **Finder 启动时工作目录是 `/`**,而本程序的库路径按「当前目录」解析(与原版一致,
#       刻意不改代码),所以 bundle 里放一个 launcher 脚本当 CFBundleExecutable,先切到
#       ~/Library/Application Support/KindleMate2/ 再 exec 真程序。
#       不能切到 .app 内部:那样既会在应用更新时丢数据,也会破坏 bundle 的代码签名。
#     - 未做公证(无 Apple 开发者账号),用户首次启动需清 quarantine,已在 Release 正文提示。
#
# 2026-09-13 变更 D:构建 SDK 必须 **10.x**(并删掉了"钉 SDK 8"的临时 global.json 步骤):
#   Avalonia 12 的源生成器(Avalonia 包内 analyzers/dotnet/cs/Avalonia.Generators.dll)
#   引用 Microsoft.CodeAnalysis 4.14.0.0,而 SDK 8 的 Roslyn 是 4.8(SDK 9 是 4.12)——
#   Roslyn 会拒绝加载它(只发一条 CS9057 警告)并**静默跳过**,于是 InitializeComponent
#   与所有 x:Name 字段都没被声明,每个 .axaml.cs 满屏 CS0103、所有变体一起失败。
#
# 2026-09-14 变更 E:目标框架 net8.0 → net10.0(Windows 侧 net8.0-windows → net10.0-windows)。
#   动机:① .NET 8 支持终止于 2026-11-10(与 .NET 9 同日);
#         ② 依赖栈已全面站到 10.x(Microsoft.Data.Sqlite / Microsoft.Extensions.DependencyInjection /
#            System.Management / Microsoft.NET.Test.Sdk 均已是 10.x),且 Avalonia 12.1.2 与
#            MediaDevices 2.0.0 都自带 net10.0 资产,原先反而是「net8 壳调 net10 库」;
#         ③ 构建 SDK 自 2026-09-13 起已是 10.x,TFM 跟上后两者不再错位。
#   ⚠️ 用户端影响(发布说明需写明):本矩阵中**无后缀的 3 个 Windows 框架依赖变体**,运行时要求由
#      .NET 8 Desktop Runtime 变为 .NET 10 Desktop Runtime(_runtime 后缀的自包含变体不受影响);
#      Linux 的 glibc 底线由 2.23 抬到 2.27(CentOS 7 这类 glibc 2.17 的发行版不再可运行)。
#      Windows / macOS 的 OS 下限不变(两份 supported-os 表逐字相同)。
#
# 注:应用内自动更新直接走本仓库的 GitHub Releases API(见 Application/Services/UpdateChecker),
# 不使用 AppCast —— 旧的 update_*.xml 是 WinForms 壳 AutoUpdater 时代的产物,已随壳退役删除。
# 因此发版无"更新 AppCast"这一步。

permissions:
  contents: read

on:
  push:
    tags:
      - '2[0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:
    inputs:
      version:
        description: '手动发布版本号(留空则读取 csproj <Version>)'
        required: false
        default: ''

jobs:
  # 发布前必须先过测试:此前 release 流程完全不跑 dotnet test,打一个 tag 就能把未经测试的
  # 二进制发出去。这里在 ubuntu 上跑跨平台单测(真机/联网探测默认跳过),publish 各 job 依赖它。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Run tests
        run: dotnet test KindleMate2.Tests/KindleMate2.Tests.csproj -c Release --filter "Category!=Manual"

  # 版本号只解析一次,供各构建与发布 job 复用(原先在 publish / release 各写一遍,改一处容易漏另一处;
  # 版本号错了会让 Release 打错 tag,所以收敛成单一来源)。
  version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      # 全历史:csproj 不再维护 <Version>,版本号回落到 git tag,需要 tag 才能解析。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 输入经 env 传入,不插值进脚本 —— 否则手动 dispatch 的 version 里塞
      # `"; <payload>; #` 会被当 PowerShell 执行(命令注入)。
      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:REF_TYPE -eq 'tag') { $v = $env:REF_NAME }
          else { $v = $env:INPUT_VERSION }
          if ($v -eq '' -or $v -eq $null) {
            # csproj 不再维护 <Version> ⇒ 回落到最新的日期式 tag
            $v = (git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | Select-Object -First 1)
            if ($LASTEXITCODE -ne 0) { throw 'git tag 读取失败' }
          }
          if ($v -eq '') { throw '无法解析版本号:请显式传入 version,或检查 csproj 里的 <Version>' }
          # 只允许数字点分(可带预发布后缀):版本号随后要拼进 `-p:Version=` 与 tag,
          # 校验能挡住借它做命令注入 / 非法 tag。
          if ($v -notmatch '^\d+(\.\d+){1,3}(-[0-9A-Za-z.]+)?$') { throw "版本号含非法字符,拒绝:$v" }
          Write-Output "本次发布版本号: $v"
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

  publish:
    needs: [version, test]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      # _runtime = self-contained(自带 .NET);无后缀 = framework-dependent
      # (命名规则用户确认 2026-09-06:与常规直觉相反,_runtime 表示免装)
      matrix:
        include:
          - { rid: win-arm64, self: 'false', suffix: arm64 }
          - { rid: win-arm64, self: 'true',  suffix: arm64_runtime }
          - { rid: win-x64,   self: 'false', suffix: x64 }
          - { rid: win-x64,   self: 'true',  suffix: x64_runtime }
          - { rid: win-x86,   self: 'false', suffix: x86 }
          - { rid: win-x86,   self: 'true',  suffix: x86_runtime }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          # 必须 10.x(见文件头变更 D):Avalonia 12 的源生成器要求 Roslyn >= 4.14。
          dotnet-version: 10.0.x

      # 注:此处 2026-09-13 删除了「Pin SDK 8 (temporary global.json)」—— 它是 WinForms 时代
      # 为躲「SDK10 发布 net8 目标 + -r + 旧 assets 触发 NuGet restore 崩溃(MSB4181)」加的补丁,
      # 换到 Avalonia 壳后已变成有害的遗留(详见文件头变更 D)。

      - name: Publish (${{ matrix.suffix }})
        run: dotnet publish KindleMate2.Avalonia/KindleMate2.Avalonia.csproj -f net10.0-windows -c Release -r ${{ matrix.rid }} --self-contained ${{ matrix.self }} -p:Version=${{ needs.version.outputs.version }} -o publish/${{ matrix.suffix }}

      - name: Package zip (KindleMate2_${{ matrix.suffix }}.zip)
        shell: pwsh
        run: |
          $name = "KindleMate2_${{ matrix.suffix }}.zip"
          Compress-Archive -Path "publish/${{ matrix.suffix }}/*" -DestinationPath $name

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.suffix }}
          path: KindleMate2_${{ matrix.suffix }}.zip
          retention-days: 1

  # Linux 产物(见文件头变更 B)。用 -f net10.0:设备层在 Linux 上由 Devices.Linux
  # 兜底,Windows / macOS 专有实现各自按「平台 + TFM」条件引用,不参与本产物的编译。
  publish-linux:
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   self: 'false', suffix: linux-x64 }
          - { rid: linux-x64,   self: 'true',  suffix: linux-x64_runtime }
          - { rid: linux-arm64, self: 'false', suffix: linux-arm64 }
          - { rid: linux-arm64, self: 'true',  suffix: linux-arm64_runtime }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish (${{ matrix.suffix }})
        run: dotnet publish KindleMate2.Avalonia/KindleMate2.Avalonia.csproj -f net10.0 -c Release -r ${{ matrix.rid }} --self-contained ${{ matrix.self }} -p:Version=${{ needs.version.outputs.version }} -o publish/${{ matrix.suffix }}

      - name: Add launcher + package tarball (KindleMate2_${{ matrix.suffix }}.tar.gz)
        shell: bash
        run: |
          set -euo pipefail
          d="publish/${{ matrix.suffix }}"

          # 启动器。程序按「当前工作目录」定位数据库(与原版一致,刻意不改代码),
          # 而从文件管理器双击或从别处调用时,工作目录并不在解压目录 —— 先切到数据目录再启动真程序。
          # 数据目录遵守 XDG:优先 $KINDLEMATE2_HOME,否则 ${XDG_DATA_HOME:-~/.local/share}/KindleMate2。
          cat > "$d/kindlemate2" <<'LAUNCH'
          #!/bin/bash
          set -e
          self="$(readlink -f "$0" 2>/dev/null || echo "$0")"   # 允许被软链到 ~/.local/bin 等位置
          here="$(cd "$(dirname "$self")" && pwd)"
          if [ -n "${KINDLEMATE2_HOME:-}" ]; then
            data="$KINDLEMATE2_HOME"
          else
            data="${XDG_DATA_HOME:-$HOME/.local/share}/KindleMate2"
          fi
          mkdir -p "$data"
          cd "$data"
          exec "$here/KindleMate2" "$@"
          LAUNCH

          # 可执行位必须在这里补上 —— 这是不用 zip、且必须在 Unix 上打包的原因。
          chmod +x "$d/KindleMate2" "$d/kindlemate2"
          # 自包含包多一个 createdump 辅助程序,同样要可执行(不存在则跳过,别让 set -e 提前退出)
          if [ -f "$d/createdump" ]; then chmod +x "$d/createdump"; fi
          tar -czf "KindleMate2_${{ matrix.suffix }}.tar.gz" -C "$d" .

      # 真实启动自检:解压产物后跑 --smoke,断言平台设备实现按预期选中(空实现仅作为兜底分支保留)。
      # 走 kindlemate2 启动器(而不是直接调 apphost),这样「先切到数据目录」的逻辑也一并验到;
      # 因此传参必须用绝对路径(切目录后相对路径的含义就变了)。
      - name: Boot self-check (linux-x64_runtime)
        if: matrix.suffix == 'linux-x64_runtime'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar -xzf "KindleMate2_${{ matrix.suffix }}.tar.gz" -C "$work"
          test -x "$work/kindlemate2"
          touch "$work/empty.dat"
          "$work/kindlemate2" --smoke "$work/empty.dat" "$work/smoke.txt"
          cat "$work/smoke.txt"
          # Linux 现在也有真实设备实现(/media 等候选挂载根 + 经 libmtp 的 MTP),不再降级为 NullDeviceManager
          grep -q "Devices.Linux.DeviceManager" "$work/smoke.txt"
          # 启动器建了 XDG 数据目录,说明它确实跑到并切过去了(而不只是 apphost 能跑)
          test -d "${XDG_DATA_HOME:-$HOME/.local/share}/KindleMate2"
          echo "unix 产物 + 启动器自检通过:${{ matrix.suffix }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.suffix }}
          path: KindleMate2_${{ matrix.suffix }}.tar.gz
          retention-days: 1

  # macOS 产物:.app 装在 .dmg 里(见文件头变更 C)。
  # 只出自包含版;框架依赖版在 macOS 上要求用户自行安装 .NET 运行时,不值当为对称多发两个。
  publish-macos:
    needs: [version, test]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # minos:声明 .app 的最低系统版本。原值按「.NET 8 下限 = macOS 10.15」设定,本次 TFM 升级
          # **刻意未改** —— 微软现行 supported-os 表把 .NET 10 的 macOS 支持面收窄到 26/15/14,
          # 但该表是**支持政策**而非运行时硬门槛(官方已澄清:老系统通常仍可运行,只是不受理 bug),
          # 而真实运行下限我无法在本地验证。故保守保留,待实测老 macOS 后再决定是否抬高。
          - { rid: osx-arm64, suffix: macos-arm64, minos: '11.0' }
          - { rid: osx-x64,   suffix: macos-x64,   minos: '10.15' }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish (${{ matrix.suffix }})
        run: dotnet publish KindleMate2.Avalonia/KindleMate2.Avalonia.csproj -f net10.0 -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=${{ needs.version.outputs.version }} -o publish/${{ matrix.suffix }}

      # macOS 签名/公证是**可选**的:配置了 APPLE_CERTIFICATE_BASE64 就启用,否则退回 ad-hoc。
      # 这样未持有 Apple 开发者账号(或 fork)时仍能构建,只是用户首启需清 quarantine。
      - name: Detect macOS signing credentials
        id: signing
        shell: bash
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "${CERT_B64:-}" ]; then
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "未配置 APPLE_CERTIFICATE_BASE64 → 本次 macOS 产物用 ad-hoc 签名(用户需清 quarantine)"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.signed == '1'
        shell: bash
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/km2-signing.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychain -d user -s "$KC" $(security list-keychain -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [ -z "$IDENTITY" ]; then echo "::error::证书里没有 Developer ID Application 身份"; exit 1; fi
          echo "签名身份:$IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # 图标:仓库里最大的图标源是 Assets/bookmark.png(256×256),512/1024 两档只能插值放大。
      - name: Build .icns from bookmark.png
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" KindleMate2.Avalonia/Assets/bookmark.png \
                 --out "build/icon.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z "$d" "$d" KindleMate2.Avalonia/Assets/bookmark.png \
                 --out "build/icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/KindleMate2.icns
          ls -l build/KindleMate2.icns

      - name: Build .app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="build/KindleMate2.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R "publish/${{ matrix.suffix }}/." "$APP/Contents/MacOS/"
          cp build/KindleMate2.icns "$APP/Contents/Resources/KindleMate2.icns"

          # launcher:Finder/Launchpad 启动时工作目录是 /,而库路径按「当前目录」解析,
          # 所以先切到用户数据目录再 exec 真程序(绝不切进 .app 内部:会丢数据且破坏签名)。
          cat > "$APP/Contents/MacOS/launch" <<'LAUNCH'
          #!/bin/bash
          data="$HOME/Library/Application Support/KindleMate2"
          mkdir -p "$data" || exit 1
          cd "$data" || exit 1
          exec "$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/KindleMate2" "$@"
          LAUNCH
          chmod +x "$APP/Contents/MacOS/launch" "$APP/Contents/MacOS/KindleMate2"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Kindle Mate 2</string>
            <key>CFBundleDisplayName</key><string>Kindle Mate 2</string>
            <key>CFBundleIdentifier</key><string>app.lzc.KindleMate2</string>
            <key>CFBundleExecutable</key><string>launch</string>
            <key>CFBundleIconFile</key><string>KindleMate2</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${{ needs.version.outputs.version }}</string>
            <key>CFBundleVersion</key><string>${{ needs.version.outputs.version }}</string>
            <key>LSMinimumSystemVersion</key><string>${{ matrix.minos }}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          # 内嵌 libmtp + libusb(2024 年及以后的 Kindle 只支持 MTP,而 macOS 无原生 MTP)。
          # 从源码构建**通用二进制**(一次覆盖 osx-arm64 与 osx-x64)、改好 install name 与
          # @loader_path rpath,并放进 LGPL 许可证全文 —— 必须在签名之前完成。
          # 脚本本身可在本机单独跑,便于脱离 CI 验证。
          bash scripts/bundle-libmtp.sh "$APP" --arch universal --build-dir build/libmtp

          # 签名:有 Developer ID 就正式签(hardened runtime + entitlements,由内向外),否则退回
          # ad-hoc。两条路都必须让**内嵌原生库**拿到有效签名(arm64 上内核要求所有可执行代码有签名)。
          # ⚠️ 真正 JIT 的进程镜像是 .NET apphost `Contents/MacOS/KindleMate2`(launch 脚本 exec 到它),
          #    所以 JIT 相关 entitlements 必须签在它上面,而不是 CFBundleExecutable(launch,bash)。
          #    Developer ID 分支目前**未经真机验证**(尚无 Apple 账号);启用后需实跑一次确认公证通过。
          ENTITLEMENTS="$GITHUB_WORKSPACE/scripts/macos-entitlements.plist"
          if [ -n "${IDENTITY:-}" ]; then
            echo "Developer ID 签名:$IDENTITY"
            for f in $(find "$APP/Contents" -type f \( -name '*.dylib' -o -name '*.so' -o -name 'createdump' \)); do
              codesign --force --options runtime --timestamp --sign "$IDENTITY" "$f"
            done
            codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" --sign "$IDENTITY" "$APP/Contents/MacOS/KindleMate2"
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
          else
            echo "无 Developer ID 凭据 → ad-hoc 签名(用户首次启动需清 quarantine)"
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --verbose=2 "$APP"
          echo "app bundle 就绪:$(du -sh "$APP" | cut -f1)"

      - name: Package dmg (KindleMate2_${{ matrix.suffix }}.dmg)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dmg
          cp -R build/KindleMate2.app build/dmg/
          ln -s /Applications "build/dmg/Applications"   # 打开镜像后可直接拖入 Applications
          hdiutil create -volname "Kindle Mate 2" -srcfolder build/dmg -ov -format UDZO \
            "KindleMate2_${{ matrix.suffix }}.dmg"
          # 有 Developer ID 时把 dmg 也签上(公证要求外层也签)
          if [ -n "${IDENTITY:-}" ]; then
            codesign --force --timestamp --sign "$IDENTITY" "KindleMate2_${{ matrix.suffix }}.dmg"
          fi
          ls -l "KindleMate2_${{ matrix.suffix }}.dmg"

      # 公证 + 装订(仅签名时)。notarytool 会把 dmg 上传给 Apple 审核,通过后把凭据装订进 dmg,
      # 用户下载后 Gatekeeper 离线也能验过 —— 这是"免清 quarantine"的关键一步。
      - name: Notarize dmg + staple
        if: steps.signing.outputs.signed == '1'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG="KindleMate2_${{ matrix.suffix }}.dmg"
          if [ -n "${APPLE_API_KEY_BASE64:-}" ]; then
            KEY_DIR="$RUNNER_TEMP/private_keys"
            mkdir -p "$KEY_DIR"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
            AUTH=(--key "$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          else
            AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "已公证并装订:$DMG"

      # 发版前把产物真验一遍:挂载镜像 → 校验 bundle 签名 → 架构匹配时用 launcher 实跑 --smoke。
      # 签名、权限、架构、launcher 的 cd 逻辑,任何一项不对都在这里变红灯,而不是发一个跑不起来的包。
      - name: Verify dmg (mount / signature / boot)
        shell: bash
        run: |
          set -euo pipefail
          dmg="KindleMate2_${{ matrix.suffix }}.dmg"
          mnt="$(mktemp -d)"
          trap 'hdiutil detach "$mnt" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          ls -la "$mnt"
          codesign --verify --verbose=2 "$mnt/KindleMate2.app"

          # 内嵌的 MTP 库必须真的在包里:少了 libmtp/libusb,2024 年及以后的 Kindle 会**静默**读不到
          # (代码里会优雅降级成"连接失败"),在发布前拦下来比发出去后靠用户反馈强。
          APP_BUNDLE="$mnt/KindleMate2.app"
          for lib in libmtp.9.dylib libusb-1.0.0.dylib; do
            if [ ! -f "$APP_BUNDLE/Contents/Frameworks/$lib" ]; then
              echo "错误:缺少内嵌库 $lib" >&2
              exit 1
            fi
          done
          for license in libmtp-LGPL-2.1.txt libusb-LGPL-2.1.txt; do
            if [ ! -f "$APP_BUNDLE/Contents/Resources/licenses/$license" ]; then
              echo "错误:LGPL 要求随包附许可证,缺少 $license" >&2
              exit 1
            fi
          done

          case "${{ matrix.rid }}" in
            osx-arm64) want_arch=arm64 ;;
            *)         want_arch=x86_64 ;;
          esac
          libmtp_archs="$(lipo -archs "$APP_BUNDLE/Contents/Frameworks/libmtp.9.dylib")"
          echo "libmtp 架构:$libmtp_archs(本包需要 $want_arch)"
          case " $libmtp_archs " in
            *" $want_arch "*) ;;
            *) echo "错误:libmtp 不含 $want_arch 架构" >&2; exit 1 ;;
          esac

          case "$(uname -m)" in
            arm64) host_rid=osx-arm64 ;;
            *)     host_rid=osx-x64 ;;
          esac
          if [ "$host_rid" != "${{ matrix.rid }}" ]; then
            echo "runner 架构 $host_rid ≠ ${{ matrix.rid }},本机无法实跑,只做签名与结构校验"
            exit 0
          fi

          work="$(mktemp -d)"
          cp -R "$mnt/KindleMate2.app" "$work/"
          # 从网络取回的未签名应用会带 quarantine 标记而被 Gatekeeper 拦(用户下载后同理)
          xattr -dr com.apple.quarantine "$work/KindleMate2.app" || true
          touch "$work/empty.dat"
          # 故意走 launcher(而不是直接调 apphost),这样连「先 cd 到数据目录」也一并验证;
          # 因此这里必须用绝对路径传参。
          "$work/KindleMate2.app/Contents/MacOS/launch" --smoke "$work/empty.dat" "$work/smoke.txt"
          cat "$work/smoke.txt"
          # macOS 已有专有设备实现(/Volumes + 轮询),不再降级为 NullDeviceManager。
          grep -q "Devices.MacOS.DeviceManager" "$work/smoke.txt"
          echo "macOS 产物启动自检通过:${{ matrix.suffix }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.suffix }}
          path: KindleMate2_${{ matrix.suffix }}.dmg
          retention-days: 1

  # 生成并 GPG 签名 SHA256SUMS。独立成 job 是因为 gpg 在 Linux runner 上是一等公民
  # (Windows runner 未预装 gpg),且签名与"创建 Release"解耦。
  # 覆盖对象 = 12 个二进制资产(应用内更新正是校验这些);LGPL 源码包的哈希不在此列。
  checksums:
    needs: [publish, publish-linux, publish-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all binary assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum KindleMate2_* > SHA256SUMS
          cat SHA256SUMS

      # 复用维护者的 GPG 密钥(带口令)对清单做分离签名。公钥随 Release 一并发布,
      # 用户无需从 keyserver 取。缺 secret 直接报错,避免发出"看似签了其实没签"的发布。
      - name: GPG-sign SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::缺少 GPG_PRIVATE_KEY secret,无法签名发布包"; exit 1
          fi
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          # 带口令的密钥在无人值守环境下靠 loopback 提供口令;显式允许它更稳。
          echo 'allow-loopback-pinentry' > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --armor --export > dist/KindleMate2-release-key.asc
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor --output dist/SHA256SUMS.asc dist/SHA256SUMS
          # 自检:签名必须能验过,否则宁可让发布失败
          gpg --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          echo "签名指纹:$(gpg --with-colons --list-keys | awk -F: '/^fpr:/{print $10; exit}')"

      - name: Upload signed checksums
        uses: actions/upload-artifact@v7
        with:
          name: assets-checksums
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
            dist/KindleMate2-release-key.asc
          retention-days: 1

  release:
    needs: [version, publish, publish-linux, publish-macos, checksums]
    runs-on: windows-latest
    # 只有这一个 job 需要写权限(创建 Release);其余 job 只读。
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for notes)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # LGPL-2.1 第 6 条:随包分发库的可执行文件时,必须同时提供其源码。
      # macOS 包里内嵌了 libmtp/libusb(bundle-libmtp.sh 从这两个压缩包构建),
      # 所以把**同一份**源码附到发布页上 —— 版本因此与二进制严格对应。
      - name: Fetch embedded library sources (LGPL compliance)
        shell: pwsh
        run: |
          $sources = [ordered]@{
            'libmtp-1.1.23.tar.gz'  = 'https://downloads.sourceforge.net/project/libmtp/libmtp/1.1.23/libmtp-1.1.23.tar.gz'
            'libusb-1.0.30.tar.bz2' = 'https://downloads.sourceforge.net/project/libusb/libusb-1.0/libusb-1.0.30/libusb-1.0.30.tar.bz2'
          }
          foreach ($name in $sources.Keys) {
            Invoke-WebRequest -Uri $sources[$name] -OutFile "dist/$name" -MaximumRedirection 10
          }
          Get-ChildItem dist | Select-Object Name, Length | Format-Table

      # SHA256SUMS / SHA256SUMS.asc / KindleMate2-release-key.asc 由上面的 checksums job
      # 生成并签名,已随「Download all assets」(merge-multiple)一起落进 dist。

      - name: Build release notes (previous tag .. HEAD)
        shell: pwsh
        run: |
          # 注:一旦启用 macOS 签名/公证(配置了 APPLE_* secrets),请把下面那条
          #     「macOS 未做公证…清 quarantine」的说明改掉。
          $tags = @(git tag --sort=-version:refname)
          $prev = $null
          if ($tags.Count -gt 1) { $prev = $tags[1] }
          $log = if ($prev) { git log "$prev..HEAD" --oneline } else { git log -20 --oneline }
          $body = @('## Changes', '') + $log + @(
            '',
            '### 资产说明',
            '- Windows:`KindleMate2_{arm64,x64,x86}[_runtime].zip` —— 解压后运行 `KindleMate2.exe`。',
            '- Linux:`KindleMate2_{linux-x64,linux-arm64}[_runtime].tar.gz` —— `tar -xzf` 后运行 `./kindlemate2`(启动器会自动切到数据目录,不必手动 cd)。',
            '- macOS:`KindleMate2_{macos-arm64,macos-x64}.dmg` —— 打开后把 `KindleMate2.app` 拖进 Applications。',
            '- 带 `_runtime` = 自包含(免装 .NET 运行时);不带 = 需先安装对应平台的 .NET 10 运行时。macOS 只提供自包含包。',
            '- **本版起目标框架由 .NET 8 升到 .NET 10**(.NET 8 支持于 2026-11-10 终止):使用**不带 `_runtime` 后缀**的包,请把 .NET 8 运行时替换为 [.NET 10 运行时](https://dotnet.microsoft.com/en-us/download/dotnet/10.0)(Windows 需 Desktop Runtime);改用带 `_runtime` 的包则无需安装任何运行时。',
            '- Linux 自本版起要求 glibc ≥ 2.27(此前为 2.23):CentOS 7 等老发行版请改用自包含包或先升级系统。',
            '',
            '**校验下载(完整性)**',
            '- 每个 Release 附 `SHA256SUMS`(SHA-256 清单)、`SHA256SUMS.asc`(维护者 GPG 签名)与公钥 `KindleMate2-release-key.asc`。',
            '- 验证:`gpg --import KindleMate2-release-key.asc` → `gpg --verify SHA256SUMS.asc SHA256SUMS` → `sha256sum -c SHA256SUMS`(Windows 可用 `Get-FileHash`)。',
            '- 应用内「检查更新」在下载安装包后会自动按 `SHA256SUMS` 校验 SHA-256。',
            '',
            '**各平台数据目录**',
            '- Windows:程序所在目录(与旧版一致)。',
            '- Linux:`~/.local/share/KindleMate2/`(可用环境变量 `KINDLEMATE2_HOME` 覆盖)。**从旧版 tar.gz 升级的用户**库还在原解压目录,请先执行 `mkdir -p ~/.local/share/KindleMate2 && cp 旧目录/KM2.dat ~/.local/share/KindleMate2/`。',
            '- macOS:`~/Library/Application Support/KindleMate2/`。',
            '',
            '- macOS 未做公证(无 Apple 开发者账号),首次启动请先清除隔离标记:`xattr -dr com.apple.quarantine "/Applications/KindleMate2.app"`,或右键应用选「打开」。',
            '- Kindle 设备同步:**三个平台均支持**。Windows:USB + MTP;macOS:USB 大容量存储 + MTP(包里内嵌 libmtp);**Linux:USB 大容量存储 + MTP(自本版起新增,原先完全没有设备支持)**。2024 年及以后发布的 Kindle(12 代 Paperwhite、Colorsoft、Scribe)只支持 MTP,此前机型走 USB 大容量存储。',
            '- **Linux 用 MTP 的前提**:系统需装 libmtp 与 libusb(多数发行版的软件包里都有,如 `sudo apt install libmtp9 libusb-1.0-0`)。缺失时 USB 大容量存储方式仍照常工作,应用会在日志里说明。',
            '- **macOS 上用 MTP 读设备的三条注意事项**:① 首次插入时系统会弹「允许配件连接?」,**必须点「允许」**,否则应用看不到设备;② 每次读取结束后设备会重新枚举一次(可能再弹一次窗),属正常现象;③ 同一时刻只能有一个程序使用该设备,Amazon USB File Manager / OpenMTP / Calibre 任一开着都会导致读取失败,请先退出它们。',
            '',
            '**内嵌的开源库(LGPL)**',
            '- macOS 包内嵌了 **libmtp 1.1.23** 与 **libusb 1.0.30**(均为 LGPL-2.1-or-later,均未经修改),用于访问 MTP 模式的 Kindle。',
            '- 按许可证要求,对应源码随本发布一并提供:`libmtp-1.1.23.tar.gz`、`libusb-1.0.30.tar.bz2`;许可证全文在 `KindleMate2.app/Contents/Resources/licenses/`。',
            '- 依 LGPL-2.1 第 6b 条,你可以用自行编译的兼容版本替换 `Contents/Frameworks` 下的同名动态库(替换后需重新签名,ad-hoc 即可)。',
            '',
            'Auto-built by GitHub Actions (release workflow).'
          )
          $body | Out-File -FilePath notes.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
