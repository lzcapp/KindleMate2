name: release

# 发布即自动化:push 日期式 tag(如 2026.09.13)或手动 dispatch 触发。
# 六变体矩阵(资产命名与正式发布一致,下划线、不带版本号):
#   arm64 / x64 / x86 × framework-dependent / self-contained
# 命名规则(2026-09-06 用户确认):**_runtime = 自包含(打包 .NET Runtime,免装)**;
#   无后缀 = framework-dependent(需系统安装 .NET 8 Desktop Runtime)。
# 产物:KindleMate2_arm64[_runtime].zip、KindleMate2_x64[_runtime].zip、KindleMate2_x86[_runtime].zip
#   → 合并进 GitHub Release(免手动登录 gh)。
#
# 2026-09-13 变更:WinForms 壳与 DarkModeForms 子模块已退休,发布目标改为 Avalonia 壳
#   (KindleMate2.Avalonia)。因此本流程不再需要 checkout 子模块,并需显式指定
#   -f net8.0-windows(该工程多目标 net8.0-windows;net8.0)。
#   同时移除 PublishSingleFile —— 单文件打包属于待办 #11「各平台打包发布」的范围,
#   在未实机验证前先用普通目录式 publish(打包成 zip 后同样免安装)。
#   另:Linux/macOS 产物(linux-x64 / osx-arm64 等)同样留待 #11 补齐。
#
#   构建 SDK 必须 **10.x**(同日在下方删掉了"钉 SDK 8"的临时 global.json 步骤):
#   Avalonia 12 的源生成器(Avalonia 包内 analyzers/dotnet/cs/Avalonia.Generators.dll)
#   引用 Microsoft.CodeAnalysis 4.14.0.0,而 SDK 8 的 Roslyn 是 4.8(SDK 9 是 4.12)——
#   Roslyn 会拒绝加载它(只发一条 CS9057 警告)并**静默跳过**,于是
#   InitializeComponent 与所有 x:Name 字段都没被声明,每个 .axaml.cs 满屏 CS0103、六变体全挂。
#
# 注意:应用内自动更新 AppCast(update_*.xml)由站点 https://github.lzc.app/KindleMate2/ 托管
# (不在本仓库);发布后需在站点把对应 AppCast 指向本 Release 资产(workflow 不含该步骤)。
# framework-dependent 变体需要目标机安装 .NET 8 Desktop Runtime。

permissions:
  contents: write

on:
  push:
    tags:
      - '2[0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:
    inputs:
      version:
        description: '手动发布版本号(留空则读取 csproj <Version>)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      # _runtime = self-contained(自带 .NET);无后缀 = framework-dependent
      # (命名规则用户确认 2026-09-06:与常规直觉相反,_runtime 表示免装)
      matrix:
        include:
          - { rid: win-arm64, self: 'false', suffix: arm64 }
          - { rid: win-arm64, self: 'true',  suffix: arm64_runtime }
          - { rid: win-x64,   self: 'false', suffix: x64 }
          - { rid: win-x64,   self: 'true',  suffix: x64_runtime }
          - { rid: win-x86,   self: 'false', suffix: x86 }
          - { rid: win-x86,   self: 'true',  suffix: x86_runtime }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          # 必须 10.x(见文件头说明):Avalonia 12 的源生成器要求 Roslyn >= 4.14。
          dotnet-version: 10.0.x

      # (2026-09-13 移除)此处原有一步「Pin SDK 8 (temporary global.json)」,写一个钉 8.0.100 的
      # global.json 到仓根。它是 WinForms 时代的补丁(躲「SDK10 发布 net8 + -r + 旧 assets 触发
      # NuGet restore 崩溃 MSB4181/path1 null」),换到 Avalonia 壳后已变成有害的遗留:
      # SDK 8 的 Roslyn 4.8 < 生成器要求的 4.14 → 生成器被静默跳过 → CS0103 满屏(2026-09-13 实测)。
      # 旧理由对现在的工程也不再成立:本地用 SDK 10 + 同样的 -r/--self-contained 参数发布通过,
      # `dotnet restore -r win-x64 --force` 同样干净。故改为直接钉 SDK 10,不再写临时 global.json。

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq 'tag') { $v = "${{ github.ref_name }}" }
          else { $v = "${{ github.event.inputs.version }}" }
          if ($v -eq '') {
            $m = Select-String -Path 'KindleMate2.Avalonia/KindleMate2.Avalonia.csproj' -Pattern '<Version>([^<]+)</Version>'
            $v = $m.Matches[0].Groups[1].Value
          }
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (${{ matrix.suffix }})
        run: dotnet publish KindleMate2.Avalonia/KindleMate2.Avalonia.csproj -f net8.0-windows -c Release -r ${{ matrix.rid }} --self-contained ${{ matrix.self }} -p:Version=${{ steps.ver.outputs.version }} -o publish/${{ matrix.suffix }}

      - name: Package zip (KindleMate2_${{ matrix.suffix }}.zip)
        shell: pwsh
        run: |
          $name = "KindleMate2_${{ matrix.suffix }}.zip"
          Compress-Archive -Path "publish/${{ matrix.suffix }}/*" -DestinationPath $name
          Write-Output "asset=$name" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.suffix }}
          path: KindleMate2_${{ matrix.suffix }}.zip
          retention-days: 1

  release:
    needs: publish
    runs-on: windows-latest
    steps:
      - name: Checkout (full history for notes)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq 'tag') { $v = "${{ github.ref_name }}" }
          else { $v = "${{ github.event.inputs.version }}" }
          if ($v -eq '') {
            $m = Select-String -Path 'KindleMate2.Avalonia/KindleMate2.Avalonia.csproj' -Pattern '<Version>([^<]+)</Version>'
            $v = $m.Matches[0].Groups[1].Value
          }
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      - name: Download all assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Build release notes (previous tag .. HEAD)
        shell: pwsh
        run: |
          $tags = @(git tag --sort=-version:refname)
          $prev = $null
          if ($tags.Count -gt 1) { $prev = $tags[1] }
          $log = if ($prev) { git log "$prev..HEAD" --oneline } else { git log -20 --oneline }
          $body = @('## Changes', '') + $log + @('', 'Auto-built by GitHub Actions (release workflow).')
          $body | Out-File -FilePath notes.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
