name: release

# 发布即自动化:push 日期式 tag(如 2026.09.06)或手动 dispatch 触发。
# 四变体矩阵(对应站点 AppCast update_x64/x86(_runtime).xml):
#   win-x64 / win-x86 × self-contained / framework-dependent(runtime)
# 产物:KindleMate2-<ver>-win-<arch>[-runtime].zip → 合并进 GitHub Release(免手动登录 gh)。
#
# 注意:应用内自动更新 AppCast(update_*.xml)由站点 https://github.lzc.app/KindleMate2/ 托管
# (不在本仓库);发布后需在站点把对应 AppCast 指向本 Release 资产(workflow 不含该步骤)。
# framework-dependent 变体需要目标机安装 .NET 8 Desktop Runtime。

on:
  push:
    tags:
      - '2[0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:
    inputs:
      version:
        description: '手动发布版本号(留空则读取 csproj <Version>)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, self: 'true',  suffix: win-x64 }
          - { rid: win-x64, self: 'false', suffix: win-x64-runtime }
          - { rid: win-x86, self: 'true',  suffix: win-x86 }
          - { rid: win-x86, self: 'false', suffix: win-x86-runtime }
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v.StartsWith('refs/tags/')) { $v = $v.Substring('refs/tags/'.Length) }
          if ($v -eq '') { $v = "${{ github.event.inputs.version }}" }
          if ($v -eq '') {
            $m = Select-String -Path 'KindleMate2/KindleMate2.csproj' -Pattern '<Version>([^<]+)</Version>'
            $v = $m.Matches[0].Groups[1].Value
          }
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (${{ matrix.suffix }})
        run: dotnet publish KindleMate2/KindleMate2.csproj -c Release -r ${{ matrix.rid }} --self-contained ${{ matrix.self }} -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o publish/${{ matrix.suffix }}

      - name: Package zip
        shell: pwsh
        run: |
          $name = "KindleMate2-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}.zip"
          Compress-Archive -Path "publish/${{ matrix.suffix }}/*" -DestinationPath $name
          Write-Output "asset=$name" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.suffix }}
          path: KindleMate2-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}.zip
          retention-days: 1

  release:
    needs: publish
    runs-on: windows-latest
    steps:
      - name: Checkout (full history for notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v.StartsWith('refs/tags/')) { $v = $v.Substring('refs/tags/'.Length) }
          if ($v -eq '') { $v = "${{ github.event.inputs.version }}" }
          if ($v -eq '') {
            $m = Select-String -Path 'KindleMate2/KindleMate2.csproj' -Pattern '<Version>([^<]+)</Version>'
            $v = $m.Matches[0].Groups[1].Value
          }
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build release notes (previous tag .. HEAD)
        shell: pwsh
        run: |
          $tags = @(git tag --sort=-version:refname)
          $prev = $null
          if ($tags.Count -gt 1) { $prev = $tags[1] }
          $log = if ($prev) { git log "$prev..HEAD" --oneline } else { git log -20 --oneline }
          $body = @('## Changes', '') + $log + @('', 'Auto-built by GitHub Actions (release workflow).')
          $body | Out-File -FilePath notes.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
