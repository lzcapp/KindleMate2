name: release

# 发布即自动化:push 日期式 tag(如 2026.09.06)或手动 dispatch 触发。
# 六变体矩阵(资产命名与正式发布一致,下划线、不带版本号):
#   arm64 / x64 / x86 × framework-dependent / self-contained
# 命名规则(2026-09-06 用户确认):**_runtime = 自包含(打包 .NET Runtime,免装)**;
#   无后缀 = framework-dependent(需系统安装 .NET 8 Desktop Runtime)。
# 产物:KindleMate2_arm64[_runtime].zip、KindleMate2_x64[_runtime].zip、KindleMate2_x86[_runtime].zip
#   → 合并进 GitHub Release(免手动登录 gh)。
#
# 注意:应用内自动更新 AppCast(update_*.xml)由站点 https://github.lzc.app/KindleMate2/ 托管
# (不在本仓库);发布后需在站点把对应 AppCast 指向本 Release 资产(workflow 不含该步骤)。
# framework-dependent 变体需要目标机安装 .NET 8 Desktop Runtime。

permissions:
  contents: write

on:
  push:
    tags:
      - '2[0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:
    inputs:
      version:
        description: '手动发布版本号(留空则读取 csproj <Version>)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      # _runtime = self-contained(自带 .NET);无后缀 = framework-dependent
      # (命名规则用户确认 2026-09-06:与常规直觉相反,_runtime 表示免装)
      matrix:
        include:
          - { rid: win-arm64, self: 'false', suffix: arm64 }
          - { rid: win-arm64, self: 'true',  suffix: arm64_runtime }
          - { rid: win-x64,   self: 'false', suffix: x64 }
          - { rid: win-x64,   self: 'true',  suffix: x64_runtime }
          - { rid: win-x86,   self: 'false', suffix: x86 }
          - { rid: win-x86,   self: 'true',  suffix: x86_runtime }
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # runner 预装 .NET 10,host 无 global.json 时会选 10;而 SDK10 发布 net8(-r + 旧 assets)
      # 触发 NuGet restore 崩溃(MSB4181/path1 null)。项目 net8.0-windows,钉 8 发布。
      - name: Pin SDK 8 (temporary global.json)
        shell: pwsh
        run: Set-Content -Path global.json -Value '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq 'tag') { $v = "${{ github.ref_name }}" }
          else { $v = "${{ github.event.inputs.version }}" }
          if ($v -eq '') {
            $m = Select-String -Path 'KindleMate2/KindleMate2.csproj' -Pattern '<Version>([^<]+)</Version>'
            $v = $m.Matches[0].Groups[1].Value
          }
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (${{ matrix.suffix }})
        run: dotnet publish KindleMate2/KindleMate2.csproj -c Release -r ${{ matrix.rid }} --self-contained ${{ matrix.self }} -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o publish/${{ matrix.suffix }}

      - name: Package zip (KindleMate2_${{ matrix.suffix }}.zip)
        shell: pwsh
        run: |
          $name = "KindleMate2_${{ matrix.suffix }}.zip"
          Compress-Archive -Path "publish/${{ matrix.suffix }}/*" -DestinationPath $name
          Write-Output "asset=$name" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: assets-${{ matrix.suffix }}
          path: KindleMate2_${{ matrix.suffix }}.zip
          retention-days: 1

  release:
    needs: publish
    runs-on: windows-latest
    steps:
      - name: Checkout (full history for notes)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq 'tag') { $v = "${{ github.ref_name }}" }
          else { $v = "${{ github.event.inputs.version }}" }
          if ($v -eq '') {
            $m = Select-String -Path 'KindleMate2/KindleMate2.csproj' -Pattern '<Version>([^<]+)</Version>'
            $v = $m.Matches[0].Groups[1].Value
          }
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      - name: Download all assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Build release notes (previous tag .. HEAD)
        shell: pwsh
        run: |
          $tags = @(git tag --sort=-version:refname)
          $prev = $null
          if ($tags.Count -gt 1) { $prev = $tags[1] }
          $log = if ($prev) { git log "$prev..HEAD" --oneline } else { git log -20 --oneline }
          $body = @('## Changes', '') + $log + @('', 'Auto-built by GitHub Actions (release workflow).')
          $body | Out-File -FilePath notes.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
