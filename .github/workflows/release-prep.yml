# 一键发版:填版本号(或留空用当天日期)→ 在 main 上打日期式 annotated tag → 推送 →
# 显式 dispatch release.yml 触发跨平台构建 + GitHub Release。
# 用法:仓库 Actions 页 → release-prep → Run workflow。
#
# 注意:
# - **不向 main 提交任何东西**。main 开了必需状态检查(build-and-test + 两个 cross-platform),
#   直推「版本号提交」会被保护规则拒掉(GH006),而 github-actions[bot] 没有 bypass 权限。
#   版本号由 release.yml 用 `-p:Version` 注入构建,产物与「关于」页版本都由此决定;
#   csproj 不再维护 `<Version>`(版本由 git tag 派生,见 KindleMate2.Avalonia.csproj),
#   所以这里也无需 bump 任何文件。
#   (若确实要在 main 留下版本提交:改用「开 PR 走检查」,或给该 bot 配置 bypass —— 都需额外授权。)
# - 必须用 API dispatch(gh workflow run)触发 release.yml,而不是依赖 push tag 事件:
#   GitHub 规定 GITHUB_TOKEN 推送的 tag/commit 不会创建新的 workflow run。
# - 若远端已存在同名 tag 会中止,防止误覆盖已发布版本。
# - 发布后仍需在站点 https://github.lzc.app/KindleMate2/ 手动把 AppCast
#   (update_*.xml)指向新 Release 资产(workflow 不含该步骤)。

name: release-prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: '目标版本号(格式如 2026.09.07 或 2026.9.7;留空 = 当天北京时间)'
        required: false
        default: ''
        type: string

permissions:
  contents: write   # 推 tag
  actions: write    # dispatch release.yml

jobs:
  tag-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve target version
        id: ver
        shell: pwsh
        env:
          # 经 env 传入,不插值进脚本 —— 否则输入里的 `"; <payload>; #` 会被当 PowerShell 执行。
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $v = "$env:INPUT_VERSION".Trim()
          if ($v -eq '') {
            $bj = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([System.DateTime]::UtcNow, 'China Standard Time')
            $v = $bj.ToString('yyyy.MM.dd')
          } else {
            # 容错输入:2026.9.7 → 2026.09.07(年 4 位;月/日 1–2 位,自动补零)
            $parts = $v -split '\.'
            if ($parts.Count -ne 3 -or $parts[0] -notmatch '^\d{4}$' -or
                $parts[1] -notmatch '^\d{1,2}$' -or $parts[2] -notmatch '^\d{1,2}$') {
              throw "版本号格式错误: '$v'(应为 2026.09.07 或 2026.9.7 式)"
            }
            $m = [int]$parts[1]
            $d = [int]$parts[2]
            if ($m -lt 1 -or $m -gt 12 -or $d -lt 1 -or $d -gt 31) {
              throw "非法的年月日: '$v'"
            }
            $v = '{0}.{1:D2}.{2:D2}' -f $parts[0], $m, $d
            Write-Output "规范化版本号: $v"
          }
          $remote = git ls-remote --tags origin "refs/tags/$v"
          if ($LASTEXITCODE -ne 0) { throw 'git ls-remote 失败,请重试' }
          if ($remote) { throw "远端已存在 tag '$v',请换版本号(该版本可能已发布过)" }
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      - name: Tag and dispatch release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $v = $env:VERSION
          # 每一步原生命令都显式查 $LASTEXITCODE:pwsh 只把**最后一条**原生命令的退出码
          # 当作步骤结果;若不查,push / dispatch 失败会被后续成功的命令掩盖。
          git tag -a $v -m "Release $v"
          if ($LASTEXITCODE -ne 0) { throw "git tag '$v' 失败" }
          # 只推 tag,不推 main(见文件头:main 有必需状态检查,直推会被拒)
          git push origin $v
          if ($LASTEXITCODE -ne 0) { throw "git push origin $v 失败" }
          # GITHUB_TOKEN push 不触发 release.yml(平台防递归),改用 API dispatch
          gh workflow run release.yml --repo "$env:GITHUB_REPOSITORY" -f "version=$v"
          if ($LASTEXITCODE -ne 0) { throw 'dispatch release.yml 失败' }
          Write-Output "已打 tag $v 并 dispatch release.yml,构建请到 Actions 页查看"
