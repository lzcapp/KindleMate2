# 一键发版准备:填版本号(或留空用当天日期)→ 自动 bump csproj <Version>、
# 提交、打日期式 annotated tag、推送,并显式 dispatch release.yml 触发六变体
# 构建 + GitHub Release。用法:仓库 Actions 页 → release-prep → Run workflow。
#
# 注意:
# - 提交/推送由 github-actions[bot] 完成(非本机 GPG 签名);仓库未开签名强制规则。
# - 必须用 API dispatch(gh workflow run)触发 release.yml,而不是依赖 push tag 事件:
#   GitHub 规定 GITHUB_TOKEN 推送的 tag/commit 不会创建新的 workflow run。
# - 若远端已存在同名 tag 会中止,防止误覆盖已发布版本。
# - 发布后仍需在站点 https://github.lzc.app/KindleMate2/ 手动把 AppCast
#   (update_*.xml)指向新 Release 资产(workflow 不含该步骤)。

name: release-prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: '目标版本号(格式如 2026.09.07 或 2026.9.7;留空 = 当天北京时间)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

jobs:
  bump-and-tag:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve target version
        id: ver
        shell: pwsh
        env:
          # 经 env 传入,不插值进脚本 —— 否则输入里的 `"; <payload>; #` 会被当 PowerShell 执行。
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $v = "$env:INPUT_VERSION".Trim()
          if ($v -eq '') {
            $bj = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([System.DateTime]::UtcNow, 'China Standard Time')
            $v = $bj.ToString('yyyy.MM.dd')
          } else {
            # 容错输入:2026.9.7 → 2026.09.07(年 4 位;月/日 1–2 位,自动补零)
            $parts = $v -split '\.'
            if ($parts.Count -ne 3 -or $parts[0] -notmatch '^\d{4}$' -or
                $parts[1] -notmatch '^\d{1,2}$' -or $parts[2] -notmatch '^\d{1,2}$') {
              throw "版本号格式错误: '$v'(应为 2026.09.07 或 2026.9.7 式)"
            }
            $m = [int]$parts[1]
            $d = [int]$parts[2]
            if ($m -lt 1 -or $m -gt 12 -or $d -lt 1 -or $d -gt 31) {
              throw "非法的年月日: '$v'"
            }
            $v = '{0}.{1:D2}.{2:D2}' -f $parts[0], $m, $d
            Write-Output "规范化版本号: $v"
          }
          $remote = git ls-remote --tags origin "refs/tags/$v"
          if ($LASTEXITCODE -ne 0) { throw 'git ls-remote 失败,请重试' }
          if ($remote) { throw "远端已存在 tag '$v',请换版本号(该版本可能已发布过)" }
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      - name: Bump csproj version
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $v = $env:VERSION
          # 2026-09-13:发布目标已从 WinForms 壳改为 Avalonia 壳
          $path = 'KindleMate2.Avalonia/KindleMate2.Avalonia.csproj'
          $content = [System.IO.File]::ReadAllText($path)
          $new = [regex]::Replace($content, '(<Version>)[^<]*(</Version>)', "`${1}$v`${2}")
          if ($new -cne $content) {
            # 无 BOM UTF-8 写回,保持原文件编码,仅改 Version 行
            [System.IO.File]::WriteAllText($path, $new, (New-Object System.Text.UTF8Encoding($false)))
          }

      - name: Commit version bump
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KindleMate2.Avalonia/KindleMate2.Avalonia.csproj
          # 注意:不能用 if (git diff --cached --quiet) —— pwsh 把原生命令的 stdout
          # 当布尔值,--quiet 无输出恒为 false,会误走 else。必须显式看 $LASTEXITCODE。
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'csproj 已是目标版本,无需 bump 提交'
          } else {
            git commit -m "chore: 版本号升级至 $env:VERSION"
            if ($LASTEXITCODE -ne 0) { throw '提交失败' }
          }

      - name: Tag, push and dispatch release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $v = $env:VERSION
          # 每一步原生命令都显式查 $LASTEXITCODE:pwsh 只把**最后一条**原生命令的退出码
          # 当作步骤结果,若不查,push 失败也会被后面成功的 gh 掩盖、照样触发发布。
          git tag -a $v -m "Release $v"
          if ($LASTEXITCODE -ne 0) { throw "git tag '$v' 失败" }
          git push origin main
          if ($LASTEXITCODE -ne 0) { throw 'git push origin main 失败' }
          git push origin $v
          if ($LASTEXITCODE -ne 0) { throw "git push origin $v 失败" }
          # GITHUB_TOKEN push 不触发 release.yml(平台防递归),改用 API dispatch
          gh workflow run release.yml --repo "$env:GITHUB_REPOSITORY" -f "version=$v"
          if ($LASTEXITCODE -ne 0) { throw 'dispatch release.yml 失败' }
          Write-Output "已 dispatch release.yml (version=$v),构建请到 Actions 页查看"
